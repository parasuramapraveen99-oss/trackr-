[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trackr-backend"
version = "0.1.0"
description = "Trackr portfolio intelligence platform -- FastAPI production package."
requires-python = ">=3.11"

# Same engine dependencies as the root package -- pyxirr is the solver (ENGINE_SPEC
# section 4 forbids hand-rolled Newton-Raphson) and certifi supplies an explicit CA
# bundle for the bhavcopy fetch. FastAPI/pydantic/uvicorn are new: this package is the
# HTTP surface the root package never had.
dependencies = [
  "pyxirr>=0.10",
  "certifi>=2024.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  # Auth: password hashing and JWT issue/verify. No ORM -- users/sessions are raw SQL,
  # same as every other table.
  "bcrypt>=4.1",
  "pyjwt>=2.8",
  # Per-IP rate limiting on /auth/*. In-memory (slowapi's default storage) -- fine for a
  # single uvicorn worker on the alpha VPS; move to a shared Redis backend before scaling
  # past one process, since counts would otherwise reset per-worker.
  "slowapi>=0.1.9",
  # AMFI's market-cap classification (app/prices/market_cap_sources.py) is published as
  # XLSX only, unlike sector's plain CSV -- this is the one dependency that adds.
  "openpyxl>=3.1",
  # Persistence. psycopg3 maps NUMERIC to Decimal natively, so no conversion layer sits
  # between the database and the engine. Every one of these three was an "optional"
  # extra until the Vercel deploy (docs/DEPLOYMENT.md) surfaced why that was wrong for
  # a real deployment: db/connection.py, db/crypto.py, storage/s3.py and
  # ingest/zerodha_contract_note.py all import these lazily, at first use rather than
  # at module load -- so `import app.main` (and therefore Vercel's own build/bundle
  # step) succeeds without them, and the app only discovers they're missing on the
  # first real request that needs a database, PAN encryption, S3 storage, or a
  # forwarded PDF contract note. A build that "succeeds" and then 500s on every request
  # is worse than one that fails loudly at build time, which is what an unconditional
  # dependency gets you instead.
  "psycopg[binary]>=3.1",
  "cryptography>=42",
  # Private object storage. R2 is the production target and is S3-compatible, so boto3
  # covers it.
  "boto3>=1.34",
  # Contract-note PDF parsing -- the email-forwarding path (app/ingest/webhook.py,
  # app/ingest/zerodha_contract_note.py) is the primary production ingestion route per
  # docs/INGESTION.md, and brokers forward contract notes as PDFs.
  "pdfplumber>=0.11",
  # Intraday quotes for "today, before tonight's bhavcopy settles" (app/prices/live.py,
  # app/prices/yfinance_live.py) -- bhavcopy has nothing to say about right now during
  # market hours. Pulls in pandas/numpy transitively, unlike every other dependency
  # above; verify the Vercel Python bundle stays under its size ceiling after adding
  # this (see the `gmail` extra below, kept OUT of this list for exactly that ceiling).
  "yfinance>=0.2",
]

[project.optional-dependencies]
# BT-P02 hosted report/reflection worker only (app/research/platform_inference.py). Optional
# and NOT installed by default: without it, hosted jobs are refused at admission with
# PROVIDER_SDK_NOT_INSTALLED rather than failing mid-job. The web process never needs it.
hosted = [
  "anthropic>=1.0",
]
# Ask about markets Phase 5 hybrid ranking only (app/market_assistant/embedding.py): a
# small local ONNX embedding model. Optional and NOT installed by default (onnxruntime is
# large, and the Vercel bundle has a ceiling): without it MARKET_ASSISTANT_RETRIEVAL=hybrid
# degrades to BM25. Weights are fetched once by
# scripts/fetch_market_assistant_embedding_model.py, never at request time.
assistant-embeddings = [
  "fastembed>=0.4",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  # fastapi.testclient.TestClient needs httpx installed -- tests/test_db_webhook.py is
  # the first suite in this repo to drive a route over a real HTTP round trip rather
  # than calling the handler function directly (see that file's docstring for why: the
  # thing under test is provider-specific request parsing, which calling the Python
  # function directly would bypass).
  "httpx>=0.27",
  # moto mocks S3 behind a real boto3 client for offline tests -- test-only, unlike
  # boto3 itself above which the app needs at runtime whenever STORAGE_BACKEND=s3.
  "moto[s3]>=5.0",
]
# Gmail OAuth adapter -- PERSONAL TESTING ONLY, not authorised for client use until a
# Google CASA assessment clears the restricted gmail.readonly scope. See
# app/ingest/gmail_oauth.py and docs/INGESTION.md. Never wired into a router, and
# deliberately kept out of the unconditional dependency list above: Vercel's Python
# bundle has a size ceiling and this adapter is never reachable in production.
gmail = [
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]

# Vercel deploys this directory as its own project (Root Directory = trackr-backend/,
# see docs/DEPLOYMENT.md). app/main.py already matches Vercel's auto-detected entrypoint
# locations, but this is set explicitly so a future rename or restructure fails loudly
# at deploy time instead of Vercel silently picking a different file.
[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # bugbear
]

[tool.ruff.lint.per-file-ignores]
# Stubs import the types they will return once implemented; the signatures are the
# specification and must not be trimmed to satisfy an unused-import check.
"app/engine/*.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom IS `Depends(...)`/`Query(...)` in an argument
# default -- that is not a mutable-default bug, it is how a route declares what it
# needs. B008 cannot tell the difference on its own; this is the documented fix, not a
# suppression of a real one.
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
  "fastapi.Header", "fastapi.Form", "fastapi.File",
]
